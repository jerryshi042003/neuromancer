<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LINE</title>
<link rel="manifest" href="/neuromancer/line/manifest.webmanifest">
<link rel="apple-touch-icon" href="/neuromancer/line/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LINE">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--fg:#e6e6e6;--dim:#7c7c7c;--hot:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 Menlo,"SF Mono",ui-monospace,monospace;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top) + 14px) max(14px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(14px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #333;padding-bottom:8px;margin-bottom:12px}
header b{letter-spacing:.3em}
#clock{color:var(--dim);font-variant-numeric:tabular-nums}
canvas{width:100%;aspect-ratio:1/1;display:block;border:1px solid #222;image-rendering:pixelated;background:#000}
.log{margin-top:12px;display:grid;gap:0}
.row{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #1d1d1d;text-decoration:none;color:inherit}
.row time{color:var(--dim);font-variant-numeric:tabular-nums}
.row b{display:block;color:var(--hot);font-weight:600}
.row span{color:var(--dim)}
.btn{display:block;width:100%;margin-top:14px;padding:14px;background:#fff;color:#000;border:0;font:600 14px Menlo,monospace;letter-spacing:.25em}
.note{color:var(--dim);margin-top:10px}
.big{font-size:20px;color:var(--hot);margin:8px 0}
pre{white-space:pre-wrap;margin:10px 0;color:var(--fg)}
#img{margin-top:10px}
a.back{color:var(--dim)}
</style></head><body>
<header><b>LINE</b><span id="clock"></span></header>
<canvas id="map" width="300" height="300" aria-label="map of every payphone line in Los Angeles"></canvas>
<div id="view"></div>
<script>
var API="https://neuromancer-read.jerryshi.workers.dev";
var $=function(s){return document.querySelector(s)};
setInterval(function(){$("#clock").textContent=new Date().toLocaleTimeString("en-US",{hour12:false})},1000);
var standalone = window.navigator.standalone===true || matchMedia("(display-mode: standalone)").matches;
var ID=""; try{ID=localStorage.getItem("line_id")||""}catch(e){}
var P=[], hot={};
/* map: every real payphone in LA County as a pixel. lit ones flash */
function draw(t){ var c=$("#map"),x=c.getContext("2d"); x.fillStyle="#000";x.fillRect(0,0,300,300);
  if(!P.length) return requestAnimationFrame(draw);
  var minLo=-118.95,maxLo=-117.6,minLa=33.65,maxLa=34.75;
  P.forEach(function(p){ var px=Math.round((p[3]-minLo)/(maxLo-minLo)*299), py=Math.round((maxLa-p[4])/(maxLa-minLa)*299);
    if(hot[p[0]]){ var on=Math.floor(t/350)%2; x.fillStyle=on?"#fff":"#555"; x.fillRect(px-2,py-2,5,5); x.strokeStyle="#fff"; x.strokeRect(px-6.5,py-6.5,13,13); }
    else { x.fillStyle="#5c5c5c"; x.fillRect(px,py,1,1); } });
  requestAnimationFrame(draw); }
fetch("../jackin/payphones-geo.json").then(function(r){return r.json()}).then(function(d){P=d;requestAnimationFrame(draw)});
function row(e){ var a=document.createElement("a");a.className="row";a.href="?e="+e.step;
  a.innerHTML="<time></time><div><b></b><span></span></div>"; a.querySelector("time").textContent=new Date(e.at).toLocaleTimeString("en-US",{hour12:false});
  a.querySelector("b").textContent=e.title; a.querySelector("span").textContent=e.body; return a; }
function detail(e){ var v=$("#view"); v.innerHTML="";
  var back=document.createElement("a");back.className="back";back.href="./";back.textContent="< all lines";v.appendChild(back);
  var h=document.createElement("div");h.className="big";h.textContent=e.title;v.appendChild(h);
  var pre=document.createElement("pre");
  var rec="LINE      "+e.phone+"\nLOCATION  "+e.address+", "+e.city+"\nCOORD     "+e.lat.toFixed(5)+" N  "+Math.abs(e.lon).toFixed(5)+" W\nTIME      "+new Date(e.at).toISOString().replace("T"," ").slice(0,19)+" UTC\nOWNER     state payphone record, CPUC 2026\n\n";
  if(e.kind==="enabled") rec+="incoming calls were switched off on this line in 1996.\nthey are on again.\nanyone standing at this phone can now be called.";
  if(e.kind==="ring") rec+="RING  RING  RING  RING  RING  RING\n\nsix rings, nobody there.\nthe exchange logged the caller as: UNKNOWN PROCESS";
  if(e.kind==="message") rec+="a 1-bit image was left on this line.\nit is drawn below, one pixel per bit.";
  if(e.kind==="trace") rec+="ROUTE\n  "+e.city.toUpperCase()+"  <-  LA-MAIN-04  <-  SANTA-ANA-02  <-  ORIGIN NOT FOUND\n\nthe call did not start at a phone.";
  if(e.kind==="carrier") rec+="NO CARRIER\n\nthe line went quiet at "+new Date(e.at).toLocaleTimeString("en-US",{hour12:false})+".\nthe last thing it carried was your number.";
  pre.textContent=rec; v.appendChild(pre);
  if(e.kind==="message"){ var c=document.createElement("canvas");c.id="img";c.width=64;c.height=64;v.appendChild(c);var g=c.getContext("2d");
    var bits=e.phone.replace(/\D/g,""); for(var y=0;y<64;y++)for(var x=0;x<64;x++){var d=Math.hypot(x-32,y-32),ring=Math.abs(d-((parseInt(bits[(x+y)%bits.length])+14)))<1.4; var on=ring||((x*7+y*13+parseInt(bits[(x*y)%bits.length]))%11===0&&d<30); g.fillStyle=on?"#fff":"#000"; g.fillRect(x,y,1,1);} }
  var ack=document.createElement("button");ack.className="btn";ack.textContent="ANSWER THE LINE";ack.onclick=function(){fetch(API+"/line/ack?id="+ID,{method:"POST"}).then(function(){ack.textContent="ANSWERED. NEXT ALERT SOON.";ack.disabled=true})};
  if(e.kind!=="carrier")v.appendChild(ack); hot={}; hot[e.phone]=1; }

/* ---------- transmission: plays, erodes in front of you, then is gone for good ---------- */
async function transmission(e){
  var v=$("#view"); v.innerHTML="";
  var back=document.createElement("a");back.className="back";back.href="./";back.textContent="< all lines";v.appendChild(back);
  var h=document.createElement("div");h.className="big";h.textContent="TRANSMISSION · LINE "+e.phone;v.appendChild(h);
  var cd=document.createElement("div");cd.className="note";v.appendChild(cd);
  var r=await fetch(API+"/line/transmission?id="+ID+"&step="+e.step,{cache:"no-store"});
  if(r.status===410){ gone(v,e); return; }
  var t=await r.json(); var skew=Date.now()-t.now, end=t.expires, start=new Date(e.at).getTime();
  var c=document.createElement("canvas");c.width=240;c.height=240;c.style.cssText="width:100%;aspect-ratio:1/1;image-rendering:pixelated;border:1px solid #222;margin-top:10px;display:block";v.appendChild(c);
  var log=document.createElement("pre");v.appendChild(log);
  var g=c.getContext("2d"), dead=new Uint8Array(240*240), order=[]; for(var i=0;i<dead.length;i++)order.push(i);
  for(var i=order.length-1;i>0;i--){var j=Math.random()*(i+1)|0,tmp=order[i];order[i]=order[j];order[j]=tmp}
  var lines=["CALL RECORD  LINE "+e.phone,e.address.toUpperCase()+", "+e.city.toUpperCase(),"","00:00:00  OFF HOOK","00:00:02  CARRIER","00:00:04  DATA 14400 BAUD","00:00:09  1 BIT IMAGE  240 x 240","00:00:31  SOURCE  NOT A TELEPHONE","00:00:33  HANG UP"];
  var minLo=-118.95,maxLo=-117.6,minLa=33.65,maxLa=34.75, killed=0, finished=false;
  function frame(now){
    var left=end-(Date.now()-skew), total=end-start, frac=Math.min(1,Math.max(0,1-left/total));
    var m=Math.floor(Math.max(0,left)/60000), sec=Math.floor(Math.max(0,left)%60000/1000);
    cd.textContent="erases in "+m+":"+String(sec).padStart(2,"0")+"  ·  "+Math.round(frac*100)+"% already gone";
    /* draw: scan of every payphone, sweeping toward this line */
    var im=g.createImageData(240,240),d=im.data, sweep=(now/18)%240;
    for(var k=0;k<d.length;k+=4){var v2=Math.random()<.04?90:0;d[k]=d[k+1]=d[k+2]=v2;d[k+3]=255}
    P.forEach(function(p){var x=Math.round((p[3]-minLo)/(maxLo-minLo)*239),y=Math.round((maxLa-p[4])/(maxLa-minLa)*239);if(x<0||y<0||x>239||y>239)return;var o=(y*240+x)*4,b=Math.abs(x-sweep)<6?255:150;d[o]=d[o+1]=d[o+2]=b});
    var tx=Math.round((e.lon-minLo)/(maxLo-minLo)*239),ty=Math.round((maxLa-e.lat)/(maxLa-minLa)*239), pulse=(Math.floor(now/300)%2)?255:0;
    for(var a=-7;a<=7;a++){[[tx+a,ty-7],[tx+a,ty+7],[tx-7,ty+a],[tx+7,ty+a]].forEach(function(q){if(q[0]>=0&&q[1]>=0&&q[0]<240&&q[1]<240){var o=(q[1]*240+q[0])*4;d[o]=d[o+1]=d[o+2]=pulse}})}
    /* erosion: a share of pixels has died for good, matching the time used up */
    var target=Math.floor(frac*dead.length); while(killed<target){dead[order[killed++]]=1}
    for(var q2=0;q2<dead.length;q2++){if(dead[q2]){var o2=q2*4;d[o2]=d[o2+1]=d[o2+2]=0}}
    g.putImageData(im,0,0);
    /* text loses characters at the same rate */
    log.textContent=lines.map(function(l){return l.split("").map(function(ch){return ch!==" "&&Math.random()<frac*.9?" ":ch}).join("")}).join("\n");
    if(left<=0&&!finished){finished=true;melt(c,function(){gone(v,e)});return;}
    if(!finished)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function melt(c,done){ var g=c.getContext("2d"),src=g.getImageData(0,0,240,240),off=[],sp=[];for(var x=0;x<240;x++){off[x]=-Math.random()*30;sp[x]=.6+Math.random()*1.4}
  var f=0;(function step(){f++;var im=g.createImageData(240,240),d=im.data;for(var x=0;x<240;x++){off[x]+=sp[x]*(1+f/25);var o=Math.max(0,off[x]|0);for(var y=0;y<240;y++){var sy=y-o,i=(y*240+x)*4;if(sy>=0){var j=(sy*240+x)*4;d[i]=d[i+1]=d[i+2]=src.data[j]}d[i+3]=255}}
    g.putImageData(im,0,0);if(f<90)requestAnimationFrame(step);else done()})(); }
function gone(v,e){ v.innerHTML="";
  var back=document.createElement("a");back.className="back";back.href="./";back.textContent="< all lines";v.appendChild(back);
  var h=document.createElement("div");h.className="big";h.textContent="NOT AVAILABLE";v.appendChild(h);
  var p=document.createElement("pre");p.textContent="the transmission on line "+e.phone+" erased itself at "+(e.expires?new Date(e.expires).toLocaleTimeString("en-US",{hour12:false}):"--")+".\nthere is no copy on the exchange.\n\nif you saw it, you are one of the people who did.";v.appendChild(p);
  var a=document.createElement("a");a.className="btn";a.style.textAlign="center";a.style.textDecoration="none";a.href="?board=1";a.textContent="ASK THE OTHERS";v.appendChild(a); }

/* ---------- board: one shared place to ask about it ---------- */
async function board(){ var v=$("#view"); v.innerHTML="";
  var back=document.createElement("a");back.className="back";back.href="./";back.textContent="< all lines";v.appendChild(back);
  var h=document.createElement("div");h.className="big";h.textContent="EXCHANGE BOARD";v.appendChild(h);
  var f=document.createElement("form");f.innerHTML='<textarea id="q" maxlength="240" rows="3" style="width:100%;background:#000;color:#fff;border:1px solid #444;font:14px Menlo,monospace;padding:8px" placeholder="what did you see?"></textarea><button class="btn" type="submit">POST</button>';v.appendChild(f);
  var L=document.createElement("div");L.className="log";v.appendChild(L);
  async function refresh(){ var r=await (await fetch(API+"/line/board",{cache:"no-store"})).json(); L.innerHTML="";
    (r.posts||[]).forEach(function(p){var d=document.createElement("div");d.className="row";d.innerHTML="<time></time><div><b></b><span></span></div>";d.querySelector("time").textContent=new Date(p.at).toLocaleTimeString("en-US",{hour12:false});d.querySelector("b").textContent=p.by;d.querySelector("span").textContent=p.t;L.appendChild(d)});
    if(!(r.posts||[]).length){var n=document.createElement("div");n.className="note";n.textContent="nobody has posted yet.";L.appendChild(n)} }
  f.onsubmit=async function(ev){ev.preventDefault();var t=$("#q").value.trim();if(!t)return;var r=await fetch(API+"/line/board",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:t})});if(r.ok){$("#q").value="";refresh()}else{alert(r.status===429?"wait a minute before posting again.":"could not post.")}};
  refresh(); }

function list(evts,next){ var v=$("#view"); v.innerHTML=""; hot={}; evts.forEach(function(e){hot[e.phone]=1});
  var L=document.createElement("div");L.className="log"; evts.slice().reverse().forEach(function(e){L.appendChild(row(e))}); v.appendChild(L);
  var n=document.createElement("div");n.className="note"; n.textContent=next?("next activity on the exchange: "+new Date(next).toLocaleTimeString("en-US",{hour12:false})):(evts.length?"the exchange is quiet.":""); v.appendChild(n); }
function intro(){ var v=$("#view"); v.innerHTML="";
  var p=document.createElement("pre");
  if(!standalone){ p.textContent="401 lines. all silent since 1996.\n\nto monitor them, put LINE on your home screen:\nShare  ->  Add to Home Screen\nthen open it from there."; v.appendChild(p); return; }
  p.textContent="401 lines. all silent since 1996.\nLINE will tell you when one wakes up."; v.appendChild(p);
  var b=document.createElement("button");b.className="btn";b.textContent="MONITOR THE LINES";b.onclick=connect;v.appendChild(b); }
function u8(b64){var p="=".repeat((4-b64.length%4)%4),s=atob((b64+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(s,function(c){return c.charCodeAt(0)})}
async function connect(){ try{
  var perm=await Notification.requestPermission(); if(perm!=="granted"){alert("notifications are off. LINE cannot reach you.");return;}
  var reg=await navigator.serviceWorker.ready; var key=(await (await fetch(API+"/line/key")).json()).key;
  var sub=await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)});
  var r=await (await fetch(API+"/line/sub",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({sub:sub.toJSON()})})).json();
  ID=r.id; try{localStorage.setItem("line_id",ID)}catch(e){}
  var c=await caches.open("line"); await c.put("id",new Response(ID));
  load(); } catch(e){ alert("could not connect: "+e.message); } }
async function load(){ if(new URLSearchParams(location.search).get("board")){board();return;} if(!ID){intro();return;}
  var r=await (await fetch(API+"/line/events?id="+ID,{cache:"no-store"})).json();
  var q=new URLSearchParams(location.search).get("e");
  if(new URLSearchParams(location.search).get("board")){ board(); return; }
  if(q!==null&&q!==""){ var e=(r.events||[]).filter(function(x){return String(x.step)===q})[0]; if(e){ if(e.kind==="transmission"){transmission(e);return;} detail(e);return;} }
  list(r.events||[],r.next); try{navigator.clearAppBadge&&navigator.clearAppBadge()}catch(e){} }
if("serviceWorker" in navigator) navigator.serviceWorker.register("/neuromancer/line/sw.js",{scope:"/neuromancer/line/"});
load(); setInterval(function(){ var qs=new URLSearchParams(location.search); if(ID && !qs.get("e") && !qs.get("board")) load(); },15000);
</script></body></html>
