:root{--ink:#000;--paper:#fff;--dim:#555}
*{box-sizing:border-box}

#desk{position:fixed;inset:20px 0 0 0;background-image:radial-gradient(#000 26%,transparent 27%);background-size:2px 2px;background-color:#fff}

.icons{position:absolute;inset:12px;display:grid;grid-template-columns:repeat(auto-fill,86px);grid-auto-rows:84px;gap:6px;align-content:start}
.icon{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default;user-select:none;-webkit-user-select:none;text-align:center}
.icon .g{width:34px;height:34px;background:#fff;border:1px solid #000;position:relative;image-rendering:pixelated}
.icon span{background:#fff;padding:0 3px;line-height:1.25;max-width:84px}
.icon.sel .g{background:#000}.icon.sel span{background:#000;color:#fff}
.icon.rej span{text-decoration:line-through}
.win{position:absolute;background:#fff;border:1px solid #000;box-shadow:1px 1px 0 #000;display:flex;flex-direction:column;min-width:260px;min-height:160px}
.tb{height:19px;border-bottom:1px solid #000;display:flex;align-items:center;position:relative;cursor:grab;touch-action:none;
  background:linear-gradient(#fff 2px,transparent 2px) 0 3px/100% 2px,#fff;background-image:repeating-linear-gradient(#000 0 1px,#fff 1px 2px);background-size:100% 12px;background-position:0 3px;background-repeat:no-repeat}
.tb b{margin:0 auto;background:#fff;padding:0 8px;font-family:Chicago,Charcoal,Geneva,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.tb .x{position:absolute;left:8px;top:3px;width:12px;height:12px;border:1px solid #000;background:#fff;cursor:pointer}
.tb .o{position:absolute;right:8px;top:2px;font-size:11px;background:#fff;padding:0 4px;color:#000;text-decoration:underline}
.inactive .tb{background:#fff}
.body{flex:1;display:flex;min-height:0}
.body iframe{flex:1;border:0;width:100%;height:100%;background:#000}
.info{width:230px;border-left:1px solid #000;padding:10px;overflow:auto;flex:none}
.info h3{margin:0 0 6px;font:bold 12px Chicago,Geneva,sans-serif}
.info p{margin:0 0 8px}
.tag{display:inline-block;border:1px solid #000;padding:0 4px;margin:0 4px 4px 0;font-size:10px}
.tag.inv{background:#000;color:#fff}
.grow{position:absolute;right:0;bottom:0;width:14px;height:14px;border-left:1px solid #000;border-top:1px solid #000;background:#fff;cursor:nwse-resize;touch-action:none}
.list{padding:10px 12px;overflow:auto;flex:1}
.list a{color:#000}
.list li{margin:0 0 7px}
@media (max-width:700px){.win{left:0!important;top:0!important;width:100%!important;height:100%!important}.info{display:none}}
