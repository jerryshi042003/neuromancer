<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuromancer routes</title>
<style>
:root{--bg:#d4d4cf;--sheet:#fbfbf8;--ink:#141414;--mute:#5a5a55;--sig:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--sheet:#0f0f0e;--ink:#e8e8e3;--mute:#9a9a93;--sig:#f97316}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 60px max(16px,env(safe-area-inset-right))}
.w{max-width:900px;margin:0 auto;display:grid;gap:18px}
h1{font:bold clamp(24px,5vw,40px)/1.1 "Courier New",monospace;margin:0}
p.l{margin:6px 0 0;color:var(--mute);max-width:62ch}
.r{background:var(--sheet);border:1px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:18px 20px;display:grid;gap:10px}
.r h2{margin:0;font:bold 18px "Courier New",monospace}
.tag{font:12px "Courier New",monospace;color:var(--sig)}
.flow{font:13px "Courier New",monospace;color:var(--mute)}
ol{margin:0;padding-left:20px}
li{margin:3px 0}
a{color:var(--ink)}
.go{display:inline-block;border:1px solid var(--ink);padding:6px 12px;text-decoration:none;font:13px "Courier New",monospace;margin-right:8px}
.rate{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.rate button{border:1px solid var(--ink);background:var(--sheet);color:var(--ink);padding:4px 10px;cursor:pointer;font:13px "Courier New",monospace}
.rate button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
#sum{font:13px "Courier New",monospace;white-space:pre-wrap;background:var(--sheet);border:1px dashed var(--ink);padding:12px}
</style></head><body><div class="w">
<div><h1>NEUROMANCER / ROUTES</h1>
<p class="l">Seven ways a stranger finds the game. Each one ends at the phone company site, where the hacking starts. Opening this page puts your device in tester mode, so you can replay the game as often as you want.</p></div>
<div id="list"></div>
<div id="sum"></div>
</div>
<script>
try{localStorage.setItem("nm_tester","1")}catch(e){}
var B="https://jerryshi042003.github.io/neuromancer/";
var R=[
 {id:"call",name:"1. A payphone rings",tag:"needs Twilio for the real thing; simulated here",flow:"you walk past a payphone → it rings → a voice gives you the site → you hack in",
  steps:["Open the call page on your phone, sound on.","Tap WALK PAST, then PICK UP when it rings.","Listen to the voice. It tells you where to go."],links:[["try it",B+"call/"]]},
 {id:"tap",name:"2. Tap your phone on the booth (NFC)",tag:"new tech · needs NFC stickers",flow:"a blank sticker on a payphone → hold your iPhone near it → a banner pops up → the voice → the site",
  steps:["Real thing: buy NTAG215 stickers, write this page's link onto one with the free NFC Tools app, stick it on a payphone.","Hold an unlocked iPhone XS or newer near the sticker. Tap the banner.","For now, open the page directly to see what happens after the tap."],links:[["what the tap opens",B+"tap/"]]},
 {id:"wifi",name:"3. A Wi-Fi name near the booth",tag:"new tech · free, your iPhone",flow:"someone opens their Wi-Fi list → sees a line of the story → it tells them what to do",
  steps:["Settings > General > About > Name: set it to  IF IT RINGS ANSWER IT","Settings > Personal Hotspot: turn on Allow Others to Join.","On another phone, open Settings > Wi-Fi and look at the list. Change your name back after."],links:[]},
 {id:"sound",name:"4. The static talks (hidden sound)",tag:"new tech · laptop + phone",flow:"TV static plays on a screen or video → a phone listening decodes a hidden message → the site",
  steps:["On a laptop, open the static page and click once for sound.","On your phone, open the listen page in Safari, tap LISTEN, allow the microphone.","Hold the phone near the laptop speaker for up to 12 seconds."],links:[["static (laptop)",B+"static/"],["listen (phone)",B+"listen/"]]},
 {id:"pause",name:"5. A word hidden in the static (pause the video)",tag:"classic · laptop",flow:"the static flashes a word for a split second → you pause or screenshot → you find the site",
  steps:["Open the static page and watch the bottom of the screen.","Every 9 seconds a word flashes for a few frames. Try to catch it, or screen-record and step through."],links:[["static",B+"static/"]]},
 {id:"trick",name:"0. Your phone gets taken over (try this first)",tag:"new tech · your iPhone, sound on",flow:"you answer → the screen strobes and buzzes → the voice talks machine-to-machine → a coded message for any AI → it hands your phone a contact card and a calendar invite",
  steps:["Open the incoming page on your iPhone, sound up, ringer on.","Tap ANSWER. Tap the screen during the flashes: each tap is a haptic tick on iPhone.","Copy the coded text and paste it into ChatGPT: ask what it says.","Tap MY NUMBER (adds The Voice to Contacts) and WHEN I CALL (a calendar invite for 5 PM tomorrow with an alert)."],links:[["try it",B+"trick/"]]},
 {id:"flyer",name:"6. A flyer your camera reads",tag:"new tech (iOS 15+) · print or show on screen",flow:"a tear-off flyer on a pole → point the normal camera at the address → tap the link",
  steps:["Open the flyer on your laptop, or print it.","Point your iPhone's normal Camera app at the address line. Tap the yellow link button."],links:[["flyer",B+"poster/"]]}
];
var S={};try{S=JSON.parse(localStorage.getItem("nm_rates")||"{}")}catch(e){}
var L=document.getElementById("list");
R.forEach(function(r){var d=document.createElement("section");d.className="r";
  d.innerHTML="<h2></h2><div class='tag'></div><div class='flow'></div><ol></ol><div class='links'></div><div class='rate'>fun and satisfying? </div>";
  d.querySelector("h2").textContent=r.name;d.querySelector(".tag").textContent=r.tag;d.querySelector(".flow").textContent=r.flow;
  r.steps.forEach(function(s){var li=document.createElement("li");li.textContent=s;d.querySelector("ol").appendChild(li)});
  r.links.forEach(function(k){var a=document.createElement("a");a.className="go";a.href=k[1];a.textContent=k[0];d.querySelector(".links").appendChild(a)});
  ["meh","ok","fun","best"].forEach(function(v){var b=document.createElement("button");b.textContent=v;b.type="button";b.setAttribute("aria-pressed",S[r.id]===v);
    b.onclick=function(){S[r.id]=v;try{localStorage.setItem("nm_rates",JSON.stringify(S))}catch(e){};[].forEach.call(d.querySelectorAll(".rate button"),function(x){x.setAttribute("aria-pressed",x.textContent===v)});sum()};d.querySelector(".rate").appendChild(b)});
  L.appendChild(d)});
function sum(){document.getElementById("sum").textContent="your ratings (copy and send to Claude):\n"+R.map(function(r){return r.name+": "+(S[r.id]||"-")}).join("\n")}
sum();
</script></body></html>
