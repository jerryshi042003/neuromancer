<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>you touched the phone</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:15px/1.7 "Courier New",monospace;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.c{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px}
#t{font-size:clamp(18px,5vw,30px);letter-spacing:.12em;max-width:22ch;min-height:3em;text-shadow:0 0 8px #000}
button{background:#000;border:1px solid #aaa;color:#fff;font:inherit;letter-spacing:.3em;padding:12px 20px;cursor:pointer}
a{color:#fff}
</style></head><body>
<canvas id="s" width="160" height="100"></canvas>
<div class="c"><div id="t">you touched the phone.</div><button id="b">LISTEN</button></div>
<script>
var c=document.getElementById("s"),x=c.getContext("2d"),im=x.createImageData(160,100),fade=1;
(function f(){for(var i=0;i<im.data.length;i+=4){var v=Math.random()*255*fade;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);requestAnimationFrame(f)})();
try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}
function speak(t){return new Promise(function(r){try{var u=new SpeechSynthesisUtterance(t);u.rate=.86;u.pitch=.7;var v=speechSynthesis.getVoices().filter(function(x){return /Daniel|Fred|Alex|Male/i.test(x.name)})[0];if(v)u.voice=v;u.onend=r;u.onerror=r;speechSynthesis.speak(u);setTimeout(r,t.length*95+2500)}catch(e){r()}})}
document.getElementById("b").onclick=async function(){ this.remove(); var t=document.getElementById("t");
  var L=["this phone is one of four hundred and sixty two.","every one of them was told not to ring.","there is a way to change that. it starts at the phone company."];
  for(var i=0;i<L.length;i++){t.textContent=L[i];await speak(L[i]);fade=Math.max(.25,fade-.25);}
  t.innerHTML='<a href="../jackin/">enter</a>'; };
</script></body></html>
