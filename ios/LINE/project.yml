name: LINE
options:
  bundleIdPrefix: io.github.jerryshi042003
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 39225XZQP2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LINE:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jerryshi042003.line
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Cracked Static"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LINE
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "LINE rings when a payphone line opens."
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: "LINE points to another phone running LINE."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "LINE finds another phone running LINE nearby."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "LINE finds the nearest real payphone to you. Your location never leaves the phone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        NSBonjourServices: ["_line-ni._tcp", "_line-ni._udp"]
        UIBackgroundModes: [audio]
    dependencies:
      - target: LINEWidgets
      - target: LINEClip
  LINEWidgets:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jerryshi042003.line.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LINE
        INFOPLIST_KEY_NSExtension: {NSExtensionPointIdentifier: com.apple.widgetkit-extension}
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LINEClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources: [Clip]
    entitlements:
      path: Clip/Clip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers: ["$(AppIdentifierPrefix)io.github.jerryshi042003.line"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jerryshi042003.line.Clip
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LINE
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
