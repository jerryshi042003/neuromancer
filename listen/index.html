<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>listen</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#9a9a9a;font:14px/1.6 "Courier New",monospace}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box}
#b{background:none;border:1px solid #9a9a9a;color:#ddd;font:inherit;letter-spacing:.3em;padding:12px 22px;cursor:pointer}
#got{font-size:clamp(32px,9vw,72px);color:#fff;letter-spacing:.15em;margin:18px 0}
#lvl{height:2px;background:#4fe3c1;width:0;margin:16px auto 0;transition:width .1s}
a{color:#4fe3c1}
</style></head><body>
<div>
  <button id="b">LISTEN</button>
  <div id="lvl"></div>
  <div id="got"></div>
  <div id="go"></div>
</div>
<script src="ggwave.js"></script>
<script>
var ROUTES={"JACK IN":"../jackin/"};
document.getElementById("b").onclick=async function(){
  this.textContent="LISTENING";this.disabled=true;
  var ctx=new (window.AudioContext||window.webkitAudioContext)();
  var stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,autoGainControl:false,noiseSuppression:false}});
  var gw=await ggwave_factory(); var p=gw.getDefaultParameters(); p.sampleRateInp=ctx.sampleRate; p.sampleRateOut=ctx.sampleRate; var inst=gw.init(p);
  var src=ctx.createMediaStreamSource(stream), node=ctx.createScriptProcessor(1024,1,1);
  node.onaudioprocess=function(e){ var d=e.inputBuffer.getChannelData(0), m=0; for(var i=0;i<d.length;i++)m=Math.max(m,Math.abs(d[i]));
    document.getElementById("lvl").style.width=Math.min(100,m*300)+"%";
    var r=gw.decode(inst,new Int8Array(new Float32Array(d).buffer));
    if(r&&r.length){ var t=new TextDecoder().decode(r); document.getElementById("got").textContent=t;
      if(ROUTES[t]) document.getElementById("go").innerHTML='<a href="'+ROUTES[t]+'">'+ROUTES[t].replace("../","/")+'</a>'; } };
  src.connect(node); node.connect(ctx.destination);
};
</script></body></html>
