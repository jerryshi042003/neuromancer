<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuromancer</title>
<link rel="icon" href="/neuromancer/icon.svg">
<style>
:root{--bg:#0b0b0a;--linen:#e9dccb;--paper:#efe9dd;--ink:#2a241d;--rust:#7a3b1c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:"Gill Sans","Gill Sans MT",Calibri,"Trebuchet MS",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2200px}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .9s ease}
.off{opacity:0;pointer-events:none}

/* CASE + CLOSED BOOK */
.case{position:relative;width:min(78vw,52vh);aspect-ratio:16/21.5;border-radius:6px;cursor:pointer;
  background:
   radial-gradient(circle at 20% 15%,#9a4d22 0 8%,transparent 30%),
   radial-gradient(circle at 80% 70%,#5b2a12 0 10%,transparent 35%),
   radial-gradient(circle at 60% 20%,#3e5a46 0 4%,transparent 14%),
   linear-gradient(135deg,#6e3418,#3a1a0b 60%,#5a2c13);
  box-shadow:0 40px 80px rgba(0,0,0,.7), inset 0 0 40px rgba(0,0,0,.8)}
.case:before{content:"";position:absolute;inset:0;border-radius:6px;
  background:radial-gradient(circle,#000 0 38%,transparent 42%) 0 0/14px 12px;opacity:.55;mix-blend-mode:multiply}
.cover{position:absolute;left:11%;right:11%;top:9%;bottom:12%;border-radius:2px;transition:transform 1.2s cubic-bezier(.2,.7,.2,1),box-shadow 1.2s;
  background:
   radial-gradient(circle at 30% 25%,rgba(120,70,30,.35) 0 6%,transparent 16%),
   radial-gradient(circle at 70% 45%,rgba(140,80,30,.28) 0 5%,transparent 15%),
   radial-gradient(circle at 45% 75%,rgba(110,60,25,.3) 0 7%,transparent 18%),
   radial-gradient(circle at 80% 85%,rgba(200,110,60,.35) 0 2%,transparent 5%),
   radial-gradient(circle at 15% 60%,rgba(200,110,60,.35) 0 2%,transparent 5%),
   repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px),
   repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px),
   var(--linen);
  box-shadow:0 6px 18px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em}
.cover h1{font-weight:400;letter-spacing:.12em;font-size:clamp(18px,4.2vh,40px);color:#4a3220}
.cover p{font-size:clamp(11px,2vh,18px);color:#4a3220}
.case:hover .cover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(0,0,0,.7)}
.lift .cover{transform:translateY(-12px) scale(1.04)}

/* OPEN BOOK */
.book{position:relative;width:min(94vw,120vh);aspect-ratio:900/640;display:flex;transform-style:preserve-3d;
  filter:drop-shadow(0 30px 60px rgba(0,0,0,.7))}
.page{position:relative;width:50%;height:100%;background:var(--paper);overflow:hidden}
.page.left{border-radius:3px 0 0 3px;box-shadow:inset -18px 0 30px -18px rgba(0,0,0,.45)}
.page.right{border-radius:0 3px 3px 0;box-shadow:inset 18px 0 30px -18px rgba(0,0,0,.35)}
.page:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 120%,rgba(90,50,20,.18),transparent 60%),
  linear-gradient(90deg,rgba(80,50,20,.12),transparent 4%,transparent 96%,rgba(80,50,20,.18))}
canvas.etch{position:absolute;inset:4% 3% 4% 4%;width:93%;height:92%}
.dna{position:absolute;inset:11% 12% 10% 12%;display:grid;grid-template-columns:1fr 1fr;gap:6%;
  font-size:clamp(5px,1.18vh,11px);line-height:1.34;letter-spacing:.02em;color:#2b2622;white-space:pre;overflow:hidden}
.cavity{position:absolute;left:50%;top:42%;width:38%;aspect-ratio:1/1.05;transform:translate(-50%,-50%);
  background:#3a2414;border-radius:2px;box-shadow:inset 0 6px 14px rgba(0,0,0,.85), inset 0 -2px 4px rgba(0,0,0,.6), 0 0 0 1px rgba(60,35,15,.4)}
.disk{position:absolute;left:50%;top:50%;width:84%;aspect-ratio:1/1.04;transform:translate(-50%,-50%);cursor:pointer;
  background:linear-gradient(160deg,#2a2a2a,#0e0e0e 55%,#1b1b1b);border-radius:3% 3% 3% 3%;
  box-shadow:0 3px 8px rgba(0,0,0,.6);transition:transform .35s ease}
.disk:hover{transform:translate(-50%,-52%)}
.disk .shutter{position:absolute;left:28%;top:0;width:44%;height:36%;background:linear-gradient(90deg,#9aa0a6,#d7dbde 40%,#8d9399);border-radius:0 0 2px 2px}
.disk .shutter:after{content:"";position:absolute;left:58%;top:12%;width:16%;height:66%;background:#141414;border-radius:1px}
.disk .hub{position:absolute;left:50%;top:58%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,#c9cdd1 0 30%,#8f959b 32% 60%,#2a2a2a 62%)}
.disk .label{position:absolute;left:9%;right:9%;bottom:6%;height:24%;background:#e9e4d6;border-radius:1px;
  font-size:clamp(6px,1.2vh,11px);letter-spacing:.14em;color:#3b2f22;display:flex;align-items:center;justify-content:center}
.disk.blank .label{color:#8a8070}
.hint{position:absolute;bottom:4vh;left:0;right:0;text-align:center;color:#8b8172;font-size:13px;letter-spacing:.2em;transition:opacity .6s}

/* page flip */
.flip{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.4,.1,.2,1);z-index:3}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);overflow:hidden}
.flip .back{transform:rotateY(180deg)}
.flip.turned{transform:rotateY(-180deg)}

/* 1992 SCREEN */
.crt{position:relative;width:min(94vw,calc(86vh*512/342));aspect-ratio:512/342;padding:2.2%;background:#d8d1bf;border-radius:18px;
  box-shadow:inset 0 0 0 2px #b9b19d,0 40px 90px rgba(0,0,0,.85)}
.crt:after{content:"";position:absolute;inset:2.2%;border-radius:10px;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(0,0,0,.35)),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px)}
#mac{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:8px}
#hx{position:fixed;left:-99px;opacity:0}
.void{position:fixed;inset:0;background:#000;color:#9a9a9a;display:flex;align-items:center;justify-content:center;font:14px/1 Monaco,ui-monospace,monospace;letter-spacing:.3em;z-index:9}
.screen{position:relative;width:min(92vw,760px);height:min(78vh,560px);background:#000;border-radius:14px;padding:22px;
  box-shadow:0 0 0 10px #c9c3b4,0 0 0 12px #9d978a,0 40px 90px rgba(0,0,0,.8)}
.win{position:relative;width:100%;height:100%;background:#fff;border:2px solid #000;overflow:hidden;
  font-family:"Geneva","Chicago","Monaco",ui-monospace,Menlo,monospace;color:#000}
.bar{height:22px;border-bottom:2px solid #000;background:repeating-linear-gradient(0deg,#000 0 1px,#fff 1px 3px);display:flex;justify-content:center;align-items:center}
.bar span{background:#fff;padding:0 10px;font-size:13px;font-weight:700}
.scroll{position:absolute;left:0;right:0;top:24px;bottom:0;overflow:hidden}
.poem{position:absolute;left:8%;right:8%;top:100%;font-size:clamp(14px,2.2vh,18px);line-height:1.55;white-space:pre-wrap}
.labelpict{position:absolute;inset:24px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fff}
.labelpict b{font-size:clamp(26px,6vh,46px);letter-spacing:.1em}
.scan:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px)}
.again{position:absolute;bottom:3vh;left:0;right:0;text-align:center}
.again button{background:transparent;border:1px solid #8b8172;color:#cfc5b4;font:13px/1 "Gill Sans",sans-serif;letter-spacing:.2em;padding:10px 18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.flip,.cover,.scene{transition:none}}
</style>
</head>
<body>
<div class="stage">

  <!-- 1. case -->
  <div class="scene" id="s1">
    <div class="case" id="case">
      <div class="cover"><h1>NEUROMANCER</h1><p>(A Book of the Static)</p></div>
    </div>
    <div class="hint" id="h1">OPEN</div>
  </div>

  <!-- 2. book -->
  <div class="scene off" id="s2">
    <div class="book" id="book">
      <div class="page left" id="pl"><canvas class="etch" id="etchL"></canvas></div>
      <div class="page right" id="pr"><div class="dna" id="dnaR"></div></div>
      <div class="flip" id="flip">
        <div class="face front"><div class="dna" id="dnaF"></div></div>
        <div class="face back"><canvas class="etch" id="etchB"></canvas></div>
      </div>
    </div>
    <div class="hint" id="h2">TURN THE PAGE</div>
  </div>

  <!-- 3. screen: 1992 Macintosh, drawn on a canvas -->
  <div class="scene off" id="s3">
    <div class="crt" id="crt"><canvas id="mac" width="512" height="342"></canvas></div>
  </div>
</div>

<script>
var API="https://neuromancer-read.jerryshi.workers.dev", LEVEL=7, CODE="agrippa";
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* device id + fingerprint, same lock as level 4 */
function did(){try{let v=localStorage.getItem("nm_did");if(!v){v=crypto.randomUUID();localStorage.setItem("nm_did",v);}return v;}catch(e){return ""}}
let FP="";
const fpReady=import("https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@5.3.0/+esm").then(m=>m.default.load()).then(a=>a.get()).then(r=>{FP=r.visitorId}).catch(()=>{});
async function api(path,extra){await fpReady;const r=await fetch(API+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({level:LEVEL,did:did(),fp:FP,...extra})});return r.json();}
let alreadyRead=false;
api("/status",{}).then(r=>{alreadyRead=!!r.read;}).catch(()=>{});

/* sound: calm drone + shutter click (made in the browser, no files) */
let ac;
function audio(){ if(ac) return; try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const g=ac.createGain();g.gain.value=0;g.connect(ac.destination);g.gain.linearRampToValueAtTime(.05,ac.currentTime+4);
  [55,82.4,110.2].forEach((f,i)=>{const o=ac.createOscillator();o.type=i?"sine":"triangle";o.frequency.value=f;
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.07+i*.03;lg.gain.value=.6;lfo.connect(lg);lg.connect(o.frequency);lfo.start();o.connect(g);o.start();});
  const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.12;n.buffer=b;n.loop=true;const f=ac.createBiquadFilter();f.type="bandpass";f.frequency.value=900;f.Q.value=.6;
  const ng=ac.createGain();ng.gain.value=.08;n.connect(f);f.connect(ng);ng.connect(g);n.start();}
function click(){ if(!ac) return; const b=ac.createBuffer(1,ac.sampleRate*.08,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*.008));
  const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=.5;s.connect(g);g.connect(ac.destination);s.start();}

/* DNA columns */
function dnaCols(el,rows){const L="GATC";const col=()=>Array.from({length:rows},()=>Array.from({length:22},()=>L[Math.random()*4|0]).join("")).join("\n");
  el.innerHTML="";for(let i=0;i<2;i++){const d=document.createElement("div");d.textContent=col();el.appendChild(d);}}
/* gel-pattern etching */
function etch(c){const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext("2d");
  x.fillStyle="#e7dccb";x.fillRect(0,0,c.width,c.height);
  const lanes=7,lw=c.width/lanes;
  for(let l=0;l<lanes;l++){let y=Math.random()*c.height*.1;
    while(y<c.height){const h=8+Math.random()*60,w=lw*(.5+Math.random()*.35);
      const g=x.createRadialGradient(l*lw+lw/2,y,2,l*lw+lw/2,y,w);g.addColorStop(0,"rgba(40,22,10,"+(.5+Math.random()*.45)+")");g.addColorStop(1,"rgba(40,22,10,0)");
      x.fillStyle=g;x.beginPath();x.ellipse(l*lw+lw/2,y,w/2,h/2,0,0,7);x.fill();y+=h+Math.random()*90;}}
  for(let i=0;i<9000;i++){x.fillStyle="rgba(50,28,12,"+Math.random()*.25+")";x.fillRect(Math.random()*c.width,Math.random()*c.height,2,2);}
  const sm=x.createLinearGradient(0,c.height*.55,0,c.height);sm.addColorStop(0,"rgba(40,22,10,0)");sm.addColorStop(1,"rgba(40,22,10,.75)");x.fillStyle=sm;x.fillRect(0,0,c.width,c.height);}

function cavityPage(){
  $("pr").innerHTML='<div class="dna" id="dnaC"></div><div class="cavity"><div class="disk'+(alreadyRead?' blank':'')+'" id="disk"><div class="shutter"></div><div class="hub"></div><div class="label">'+(alreadyRead?'BLANK':'NEUROMANCER')+'</div></div></div>';
  dnaCols($("dnaC"),40);
  $("disk").addEventListener("click",insertDisk);
  $("h2").textContent=alreadyRead?"THE DISK IS BLANK":"TAKE THE DISK";
}

/* flow */
let spread=0; const SPREADS=3;
$("case").addEventListener("click",async()=>{audio();$("case").classList.add("lift");$("h1").style.opacity=0;await sleep(700);
  $("s1").classList.add("off");$("s2").classList.remove("off");
  etch($("etchL"));dnaCols($("dnaR"),40);dnaCols($("dnaF"),40);etch($("etchB"));});
$("book").addEventListener("click",async e=>{
  if(e.target.closest(".disk"))return;
  if(spread>=SPREADS-1)return;
  click();$("flip").classList.add("turned");await sleep(1150);
  spread++;
  $("etchL").replaceWith(Object.assign(document.createElement("canvas"),{className:"etch",id:"etchL"}));etch($("etchL"));
  $("flip").style.transition="none";$("flip").classList.remove("turned");void $("flip").offsetWidth;$("flip").style.transition="";
  if(spread===SPREADS-1){$("flip").style.display="none";cavityPage();}
  else{dnaCols($("dnaR"),40);dnaCols($("dnaF"),40);etch($("etchB"));}
});

const POEM=[
"NEUROMANCER",
"(a book of the static)",
"","",
"I.","",
"The screen was grey before it was anything.",
"A channel nobody owns,",
"a picture nobody sent.",
"You found the book.",
"The book found you first.",
"","",
"II.","",
"Somewhere in this city a phone is waiting",
"for a hand it has never held.",
"It will ring once for you.",
"It will not ring twice.",
"","",
"III.","",
"@FRAGMENT@",
"","",
"IV.","",
"Write it down.",
"Paper remembers",
"what screens forget.",
"","","",""];

/* ---------- 1992 Macintosh, 512x342, 1-bit ---------- */
var M=document.getElementById("mac"), X=M.getContext("2d"), W=512, H=342;
X.imageSmoothingEnabled=false;
function onebit(){ /* force pure black/white like a Mac Plus */
  var im=X.getImageData(0,0,W,H), d=im.data;
  for(var i=0;i<d.length;i+=4){ var v=(d[i]+d[i+1]+d[i+2])/3>140?255:0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  X.putImageData(im,0,0); }
function desktop(){ /* 50% grey dither desktop */
  X.fillStyle="#fff";X.fillRect(0,0,W,H);X.fillStyle="#000";
  for(var y=20;y<H;y++)for(var x=(y&1);x<W;x+=2)X.fillRect(x,y,1,1);
  X.fillStyle="#fff";X.fillRect(0,0,W,20);X.fillStyle="#000";X.fillRect(0,19,W,1);
  X.font="bold 12px Chicago, Charcoal, Geneva, sans-serif";X.textBaseline="middle";
  X.fillText("",12,10);X.fillText("File",34,10);X.fillText("Edit",70,10);X.fillText("Special",106,10);
  X.beginPath();X.arc(W-20,10,6,0,7);X.stroke(); }
var WX=26,WY=34,WW=W-52,WH=H-48,TOP=WY+20+44; /* window, title bar, banner */
var banner=null;
function makeBanner(){ /* ragged etched band across the top, like the disk's label strip */
  var c=document.createElement("canvas");c.width=WW-4;c.height=40;var b=c.getContext("2d");
  b.fillStyle="#fff";b.fillRect(0,0,c.width,c.height);b.fillStyle="#000";
  for(var y=0;y<40;y++)for(var x=0;x<c.width;x++){
    var band=(y>6&&y<11)||(y>16&&y<21)||(y>27&&y<30), edge=(y<4||y>34);
    var p=band?.82:edge?.25:.08; if(Math.random()<p)b.fillRect(x,y,1,1);}
  b.fillStyle="#fff";b.fillRect(c.width/2-70,13,140,14);b.fillStyle="#000";
  b.font="bold 11px Chicago, Geneva, sans-serif";b.textAlign="center";b.textBaseline="middle";b.fillText("N E U R O M A N C E R",c.width/2,20);
  banner=c; }
function frameWin(title){
  X.fillStyle="#fff";X.fillRect(WX,WY,WW,WH);X.strokeStyle="#000";X.lineWidth=1;X.strokeRect(WX+.5,WY+.5,WW-1,WH-1);
  X.fillStyle="#000";X.fillRect(WX+2,WY+WH,WW,1);X.fillRect(WX+WW,WY+2,1,WH); /* drop shadow */
  for(var i=0;i<6;i++)X.fillRect(WX+3,WY+4+i*2,WW-6,1);   /* title stripes */
  X.fillStyle="#fff";X.font="bold 12px Chicago, Charcoal, Geneva, sans-serif";var tw=X.measureText(title).width+16;
  X.fillRect(WX+WW/2-tw/2,WY+2,tw,15);X.fillStyle="#000";X.textAlign="center";X.textBaseline="middle";X.fillText(title,WX+WW/2,WY+10);X.textAlign="left";
  X.fillRect(WX,WY+19,WW,1);
  if(!banner)makeBanner(); X.drawImage(banner,WX+2,WY+21); X.fillRect(WX,WY+62,WW,1); }
function clipText(lines,offset){
  X.save();X.beginPath();X.rect(WX+1,TOP,WW-2,WY+WH-TOP-1);X.clip();
  X.fillStyle="#fff";X.fillRect(WX+1,TOP,WW-2,WY+WH-TOP);X.fillStyle="#000";
  X.font="12px Geneva, Monaco, ui-monospace, monospace";X.textBaseline="top";
  for(var i=0;i<lines.length;i++){var y=TOP+8+i*16-offset; if(y>TOP-16&&y<H)X.fillText(lines[i],WX+18,y);}
  X.restore(); }
function screen(lines,offset,title){desktop();frameWin(title||"Neuromancer");clipText(lines,offset);onebit();}

function labelScreen(){ desktop(); frameWin("Neuromancer");
  X.fillStyle="#000";X.font="bold 30px Chicago, Geneva, sans-serif";X.textAlign="center";X.textBaseline="middle";
  X.fillText("NEUROMANCER",W/2,TOP+80);X.font="12px Geneva, sans-serif";X.fillText("(a book of the static)",W/2,TOP+112);
  X.fillText("© 1992 / 2026",W/2,TOP+150);X.textAlign="left";onebit(); }

/* sounds (made here, no files): camera shutter at start, gunshot at the end */
function shutter(){ click(); setTimeout(click,70); }
function gunshot(){ if(!ac)return; var n=ac.sampleRate*.6,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*.09));
  var s=ac.createBufferSource();s.buffer=b;var f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=1800;var g=ac.createGain();g.gain.value=.9;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
  var o=ac.createOscillator(),og=ac.createGain();o.frequency.setValueAtTime(90,ac.currentTime);o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+.4);
  og.gain.setValueAtTime(.8,ac.currentTime);og.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.5);o.connect(og);og.connect(ac.destination);o.start();o.stop(ac.currentTime+.5);}

/* haptics: Android vibrates; iPhone (iOS 18+) ticks when a switch toggles */
var hx=document.createElement("input");hx.type="checkbox";hx.setAttribute("switch","");hx.id="hx";document.body.appendChild(hx);
var hl=document.createElement("label");hl.htmlFor="hx";hl.style.cssText="position:fixed;left:-99px";document.body.appendChild(hl);
function buzz(pattern){ try{ if(navigator.vibrate)navigator.vibrate(pattern); }catch(e){} try{ hl.click(); }catch(e){} }

function garble(s){var G="©ãõùèàçº¹∂π¬≈◊∆";
  return s.replace(/\S/g,function(){return Math.random()<.45?"□":G[Math.random()*G.length|0];});}

function melt(done){ /* pixel columns drip down and away */
  var im=X.getImageData(0,0,W,H),src=new Uint8ClampedArray(im.data),sp=[],off=[];
  for(var x=0;x<W;x++){sp[x]=.4+Math.random()*1.6+(Math.sin(x/9)+1)*.6;off[x]=-Math.random()*40;}
  var f=0;(function step(){f++;var d=im.data;
    for(var x=0;x<W;x++){off[x]+=sp[x]*(1+f/40);var o=Math.max(0,off[x]|0);
      for(var y=H-1;y>=0;y--){var sy=y-o,i=(y*W+x)*4;if(sy<0){d[i]=d[i+1]=d[i+2]=0;}else{var j=(sy*W+x)*4;d[i]=d[i+1]=d[i+2]=src[j];}d[i+3]=255;}}
    X.putImageData(im,0,0); if(f%12===0)buzz(20);
    if(f<150)requestAnimationFrame(step);else done();})(); }

async function insertDisk(){
  click(); buzz(30);
  var disk=$("disk");disk.style.transition="transform .9s ease, opacity .9s";disk.style.transform="translate(-50%,-160%) scale(.6)";disk.style.opacity="0";
  await sleep(900);$("s2").classList.add("off");$("s3").classList.remove("off");
  desktop();onebit();await sleep(900);
  var frag=null;
  if(!alreadyRead){try{var r=await api("/enter",{code:CODE});if(r.status==="ok")frag=r.fragment;else alreadyRead=true;}catch(e){}}
  labelScreen(); shutter(); await sleep(3200);
  var text=(alreadyRead||!frag)?null:POEM.join("\n").replace("@FRAGMENT@",frag).split("\n");
  if(!text){ var g=garble(POEM.slice(5,24).join("\n")).split("\n"); screen(g,0); await sleep(2500); return destroy(); }
  /* slow scroll, like the disk: one pixel at a time */
  var maxOff=text.length*16-(WY+WH-TOP)+40, o=-(WY+WH-TOP);
  await new Promise(function(res){ var last=0; (function step(t){ if(t-last>38){o+=1;last=t;screen(text,o);} if(o<maxOff)requestAnimationFrame(step);else res(); })(0); });
  await sleep(1800); gunshot(); buzz([60,40,60]);
  /* encryption: the text scrambles in place */
  for(var k=0;k<=24;k++){var t=k/24;screen(text.map(function(l){return l.split("").map(function(ch){return /\s/.test(ch)||Math.random()>t?ch:garble(ch);}).join("");}),o);await sleep(90);}
  await sleep(1500); destroy();
}
async function destroy(){
  buzz([80,50,80,50,200]);
  await new Promise(function(r){melt(r);});
  buzz(400);
  alert("The disk is blank.");
  var v=document.createElement("div");v.className="void";v.textContent="NO CARRIER";document.body.appendChild(v);
  await sleep(2500);
  try{window.close();}catch(e){}
  location.replace("about:blank");
}
</script>
